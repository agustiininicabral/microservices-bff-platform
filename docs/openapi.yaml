openapi: 3.0.3
info:
  title: Microservices & BFF Platform API
  version: 0.1.0
  description: Public API exposed through the YARP API Gateway. Internal service ports are not part of the public contract.
servers:
  - url: http://localhost:5080
    description: Local development gateway
tags:
  - name: Authentication
  - name: Catalog
  - name: Orders
  - name: Web BFF
paths:
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Register a customer account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { type: string, format: email }
        '400': { description: Invalid email or password }
        '409': { description: Email already registered }
        '429': { description: Authentication rate limit exceeded }
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate and receive a short-lived JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
      responses:
        '200':
          description: Access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401': { description: Invalid credentials }
        '429': { description: Authentication rate limit exceeded }
  /api/catalog/products:
    get:
      tags: [Catalog]
      summary: List catalog products
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: category
          schema: { type: string }
          required: false
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Product' }
        '401': { description: Missing or invalid bearer token }
  /api/catalog/products/{id}:
    get:
      tags: [Catalog]
      summary: Get a product by identifier
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '401': { description: Missing or invalid bearer token }
        '404': { description: Product not found }
  /api/orders:
    get:
      tags: [Orders]
      summary: List orders belonging to the authenticated customer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Customer orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Order' }
        '401': { description: Missing or invalid bearer token }
    post:
      tags: [Orders]
      summary: Create an order for the authenticated customer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { description: Invalid order items or quantities }
        '401': { description: Missing or invalid bearer token }
  /api/orders/{id}:
    get:
      tags: [Orders]
      summary: Get an order owned by the authenticated customer
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { description: Missing or invalid bearer token }
        '404': { description: Order not found or not owned by caller }
  /api/web/dashboard:
    get:
      tags: [Web BFF]
      summary: Aggregate catalog products and customer orders
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard data
          content:
            application/json:
              schema:
                type: object
                properties:
                  products:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
        '401': { description: Missing or invalid bearer token }
        '502': { description: A downstream service failed or is unavailable }
        '504': { description: A downstream service timed out }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: developer@example.com }
        password: { type: string, minLength: 12, example: StrongPassword123 }
    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, example: 1800 }
    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { type: string }
        price: { type: number, format: decimal }
        stock: { type: integer }
    OrderItem:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 100 }
    CreateOrder:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/OrderItem' }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        customerEmail: { type: string, format: email }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        createdAt: { type: string, format: date-time }
        status: { type: string, example: Pending }
