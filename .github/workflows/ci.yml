name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore MicroservicesBffPlatform.sln
      - name: Build
        run: dotnet build MicroservicesBffPlatform.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test MicroservicesBffPlatform.sln --configuration Release --no-build --logger trx
      - name: End-to-end smoke test
        run: bash scripts/smoke-test.sh
