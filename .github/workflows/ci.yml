name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore MicroservicesBffPlatform.sln
      - name: Build
        run: dotnet build MicroservicesBffPlatform.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test MicroservicesBffPlatform.sln --configuration Release --no-build --logger trx
      - name: End-to-end smoke test
        run: bash scripts/smoke-test.sh

  publish:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Identity.Api
            artifact: identity-api
          - project: Catalog.Api
            artifact: catalog-api
          - project: Orders.Api
            artifact: orders-api
          - project: Web.Bff
            artifact: web-bff
          - project: ApiGateway
            artifact: api-gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore MicroservicesBffPlatform.sln
      - name: Publish ${{ matrix.project }}
        run: dotnet publish "src/${{ matrix.project }}/${{ matrix.project }}.csproj" --configuration Release --no-restore --output "artifacts/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: artifacts/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
